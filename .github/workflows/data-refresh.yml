# Scheduled CelesTrak snapshot job. History cannot be downloaded after the fact,
# so this keeps a dated archive accumulating for the ML stage.
#
# Runs hourly; the pipeline's fetch log decides what is actually due (GP every
# 2 h, SATCAT every 12 h, space weather every 24 h), so GitHub's cron drift never
# causes a skipped update or an extra request.
#
# Setup (once): add repository secret HF_TOKEN (Hugging Face write token) and
# repository variable PERIGEE_HF_DATASET (owner/name of a PRIVATE dataset).
# See docs/data-job.md.
name: data-refresh

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# Never run two jobs at once: they share the fetch log and STOP file.
concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # The dataset name is not secret, but accept it from either place.
      PERIGEE_HF_DATASET: ${{ vars.PERIGEE_HF_DATASET || secrets.PERIGEE_HF_DATASET }}
      PERIGEE_DATA_DIR: data
    steps:
      - name: Check configuration
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$PERIGEE_HF_DATASET" ]; then
            [ -z "$HF_TOKEN" ] && echo "::error::Missing repository secret HF_TOKEN (see docs/data-job.md)"
            [ -z "$PERIGEE_HF_DATASET" ] && echo "::error::Missing PERIGEE_HF_DATASET as a repository variable or secret (see docs/data-job.md)"
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-jobs.txt

      - name: Install
        run: pip install -r requirements-jobs.txt

      - name: Pull state and latest raw snapshots
        run: python -m src.ops.archive_sync pull

      - name: Rebuild tables (baseline for count checks)
        run: python -m src.main data --offline

      - name: Fetch what is due
        id: data
        run: |
          set +e
          python -m src.main data
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # Always push: a rejected download's quarantine copy, the fetch log and any
      # STOP file must survive this runner.
      - name: Push new snapshots and state
        if: always() && steps.data.outcome == 'success'
        run: python -m src.ops.archive_sync push

      - name: Fail loudly if a download was rejected or refused
        if: always() && steps.data.outcome == 'success' && steps.data.outputs.exit_code != '0'
        run: |
          code="${{ steps.data.outputs.exit_code }}"
          if [ "$code" = "2" ]; then
            echo "::error::CelesTrak refused a request (or STOP_CELESTRAK is present). Downloads are stopped until a human deletes state/STOP_CELESTRAK in the dataset. See docs/data-job.md."
          else
            echo "::error::A download was rejected or failed (exit $code). Last good data is kept; see the job log."
          fi
          exit "$code"
