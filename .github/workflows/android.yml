# The Android app (android/, a Trusted Web Activity that opens the site in Chrome
# full screen). Run by hand for a release: builds the APK and the Play bundle, signs
# them with the release key from the repository secrets, checks the signature is the
# one the site's /.well-known/assetlinks.json names, and attaches both to a GitHub
# release. Nothing to do for an ordinary site update: the app loads the live site.
# One-time setup (the two secrets): docs/mobile-app.md.
name: android

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown to users, e.g. 1.1.0"
        required: true
      version_code:
        description: "Whole number, higher than the last release's (1.0.0 was 1)"
        required: true

permissions:
  contents: write # the release

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the inputs
        env:
          NAME: ${{ inputs.version_name }}
          CODE: ${{ inputs.version_code }}
        run: |
          [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version_name must look like 1.2.3"; exit 1; }
          [[ "$CODE" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "::error::version_code must be a whole number"; exit 1; }
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Add the ANDROID_KEYSTORE_BASE64 secret (docs/mobile-app.md)"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/perigee-release.jks"
      # The runner image has JDK 17 and the Android SDK.
      - name: Build and sign
        working-directory: android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          PERIGEE_KEYSTORE: ${{ runner.temp }}/perigee-release.jks
          PERIGEE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PERIGEE_VERSION_NAME: ${{ inputs.version_name }}
          PERIGEE_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/perigee-$PERIGEE_VERSION_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/perigee-$PERIGEE_VERSION_NAME.aab"
      - name: The signature matches the site's asset links
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          got=$("$apksigner" verify --print-certs android/dist/*.apk | sed -n 's/.*SHA-256 digest: //p' | head -1 | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          want=$(python3 -c "import json; print(json.load(open('web/public/.well-known/assetlinks.json'))[0]['target']['sha256_cert_fingerprints'][0])")
          echo "APK $got"; echo "site $want"
          [ "$got" = "$want" ] || { echo "::error::The APK is signed with a different key than assetlinks.json names: the app would show a browser bar"; exit 1; }
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/perigee-release.jks"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: perigee-android-${{ inputs.version_name }}
          path: android/dist/
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ inputs.version_name }}
        run: |
          gh release create "android-v$NAME" android/dist/* --target "$GITHUB_SHA" --title "Perigee for Android $NAME" \
            --notes "Install perigee-$NAME.apk on an Android phone (allow installs from your browser or files app when asked). The .aab is for Google Play. The app opens the live site, so data and most updates arrive without a new APK."
