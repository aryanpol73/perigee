# Ships code after CI passes on main: rebuilds the static site with the new code and
# the data the live site already serves (nothing is recomputed), publishes it to
# Cloudflare Pages and smoke-tests it. Fresh data ships separately (publish.yml).
#
# Rollback: Cloudflare keeps every deployment (dashboard: Deployments -> Rollback), or
# run this workflow by hand with `ref` set to an earlier commit (docs/runbook.md).
# Setup: docs/deployment.md.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or tag to deploy (rollback: an earlier one)"
        required: true
        default: main

permissions:
  contents: read

env:
  REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}

jobs:
  site:
    # Never for runs started by forks; only after a green CI run on main (or by hand).
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    # One site upload at a time, whichever workflow starts it.
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      PERIGEE_WEB_URL: ${{ vars.PERIGEE_WEB_URL }}
      VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN_WEB }}
    steps:
      - name: Check configuration
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_PAGES_PROJECT PERIGEE_WEB_URL; do
            if [ -z "${!v}" ]; then echo "::error::Missing $v (see docs/deployment.md)"; missing=1; fi
          done
          exit $missing
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: The data the live site serves now
        id: data
        run: |
          if python -m src.results.static_site fetch "$PERIGEE_WEB_URL" site-data; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The site has no data yet. Run the publish workflow; it builds and deploys the whole site (docs/deployment.md, first run)."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the site with this commit's code
        if: steps.data.outputs.found == 'true'
        working-directory: web
        env:
          VITE_COMMIT: ${{ env.REF }}
        run: |
          npm ci
          node scripts/build-site.mjs --data ../site-data
      - name: Publish to Cloudflare Pages
        if: steps.data.outputs.found == 'true'
        working-directory: web
        run: npx --yes wrangler@4.151.1 pages deploy dist --project-name "$CF_PAGES_PROJECT" --branch main --commit-hash "$(git rev-parse HEAD)"
      - name: Smoke test
        if: steps.data.outputs.found == 'true'
        run: bash scripts/smoke_site.sh "$PERIGEE_WEB_URL" "$(python -c "import json; print(json.load(open('site-data/index.json'))['run_id'])")"
