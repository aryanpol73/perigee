# Daily compute: rebuild the last month of snapshots from the private archive,
# screen 7 days ahead, score, compute the shell index, export the results as the
# static site's data, and publish the site (current main's code) with it to
# Cloudflare Pages. No code changes ship here (that is deploy.yml).
#
# Setup: docs/deployment.md. Secrets HF_TOKEN (reads the private archive),
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID; variables PERIGEE_HF_DATASET,
# CF_PAGES_PROJECT, PERIGEE_WEB_URL.
name: publish

on:
  schedule:
    - cron: "41 4 * * *" # daily, after a few hourly snapshots have landed
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      run_id: ${{ steps.export.outputs.run_id }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PERIGEE_HF_DATASET: ${{ vars.PERIGEE_HF_DATASET }}
      PERIGEE_DATA_DIR: data
    steps:
      - name: Check configuration
        run: |
          missing=0
          for v in HF_TOKEN PERIGEE_HF_DATASET; do
            if [ -z "${!v}" ]; then echo "::error::Missing $v (see docs/deployment.md)"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-ml.txt -r requirements-jobs.txt

      - name: Pull a month of snapshots and the newest model (private archive)
        run: python -m src.ops.archive_sync pull --history-days 30 --models

      - name: Rebuild tables from the raw archive
        run: python -m src.main rebuild

      - name: Screen 7 days ahead
        run: python -m src.main screen --workers 4

      - name: Shell risk index
        run: python -m src.main shells

      - name: Score and build the results bundle (validated, switched atomically)
        run: python -m src.main publish

      - name: Export the results as the site's data
        id: export
        run: |
          python -m src.main export-static --out site-data
          echo "run_id=$(python -c "import json; print(json.load(open('site-data/index.json'))['run_id'])")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-data
          path: site-data
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "## Publish"
            if [ -f data/results/LATEST.json ]; then
              python - <<'EOF'
          import json, pathlib
          p = json.loads(pathlib.Path("data/results/LATEST.json").read_text())
          m = json.loads((pathlib.Path("data/results") / p["path"] / "meta.json").read_text())
          keys = ["snapshot_id", "object_count", "conjunction_count", "scored_conjunctions", "model_version", "history_complete", "commit"]
          print("| | |\n|---|---|")
          for k in keys:
              print(f"| {k} | {m.get(k)} |")
          EOF
            else
              echo "No bundle was built."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  site:
    needs: compute
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    # One site upload at a time, whichever workflow starts it.
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      PERIGEE_WEB_URL: ${{ vars.PERIGEE_WEB_URL }}
      VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN_WEB }}
    steps:
      - name: Check configuration
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_PAGES_PROJECT PERIGEE_WEB_URL; do
            if [ -z "${!v}" ]; then echo "::error::Missing $v (see docs/deployment.md)"; missing=1; fi
          done
          exit $missing
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: site-data
          path: site-data
      - name: Build the site (current main's code, the new data)
        working-directory: web
        env:
          VITE_COMMIT: ${{ github.sha }}
        run: |
          npm ci
          node scripts/build-site.mjs --data ../site-data
      - name: Publish to Cloudflare Pages
        working-directory: web
        run: npx --yes wrangler@4.151.1 pages deploy dist --project-name "$CF_PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-message "Data ${{ needs.compute.outputs.run_id }}"
      - name: Smoke test
        run: bash scripts/smoke_site.sh "$PERIGEE_WEB_URL" "${{ needs.compute.outputs.run_id }}"
