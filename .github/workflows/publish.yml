# Daily compute: rebuild the last month of snapshots from the private archive,
# screen 7 days ahead, score, compute the shell index, publish the results bundle
# to the public results dataset and restart the API so it loads it. Data only: no
# code is deployed here (that is deploy.yml).
#
# Setup: docs/deployment.md. Secrets HF_TOKEN (reads the private archive) and
# HF_DEPLOY_TOKEN (writes the public results dataset, restarts the Space); variables
# PERIGEE_HF_DATASET, PERIGEE_RESULTS_REPO, PERIGEE_HF_SPACE, PERIGEE_API_URL.
name: publish

on:
  schedule:
    - cron: "41 4 * * *" # daily, after a few hourly snapshots have landed
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DEPLOY_TOKEN: ${{ secrets.HF_DEPLOY_TOKEN }}
      PERIGEE_HF_DATASET: ${{ vars.PERIGEE_HF_DATASET }}
      PERIGEE_RESULTS_REPO: ${{ vars.PERIGEE_RESULTS_REPO }}
      PERIGEE_HF_SPACE: ${{ vars.PERIGEE_HF_SPACE }}
      PERIGEE_API_URL: ${{ vars.PERIGEE_API_URL }}
      PERIGEE_DATA_DIR: data
    steps:
      - name: Check configuration
        run: |
          missing=0
          for v in HF_TOKEN HF_DEPLOY_TOKEN PERIGEE_HF_DATASET PERIGEE_RESULTS_REPO PERIGEE_HF_SPACE PERIGEE_API_URL; do
            if [ -z "${!v}" ]; then echo "::error::Missing $v (see docs/deployment.md)"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-ml.txt -r requirements-jobs.txt

      - name: Pull a month of snapshots and the newest model (private archive)
        run: python -m src.ops.archive_sync pull --history-days 30 --models

      - name: Rebuild tables from the raw archive
        run: python -m src.main rebuild

      - name: Screen 7 days ahead
        run: python -m src.main screen --workers 4

      - name: Shell risk index
        run: python -m src.main shells

      - name: Score and build the results bundle (validated, switched atomically)
        run: python -m src.main publish

      - name: Upload the bundle to the public results dataset
        run: HF_TOKEN="$HF_DEPLOY_TOKEN" python -m src.results.remote push

      - name: Restart the API so it downloads the new bundle
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_DEPLOY_TOKEN"]).restart_space(os.environ["PERIGEE_HF_SPACE"])
          EOF

      - name: Check the API serves the new run
        run: |
          want=$(python -c "import json; print(json.load(open('data/results/LATEST.json'))['run_id'])")
          for i in $(seq 1 40); do
            got=$(curl -fsS "$PERIGEE_API_URL/v1/health" | python -c "import sys, json; print(json.load(sys.stdin)['snapshot_id'])" 2>/dev/null || true)
            [ "$got" = "$want" ] && { echo "API serves $got"; exit 0; }
            sleep 15
          done
          echo "::error::The API did not start serving run $want within 10 minutes (last answer: ${got:-none})"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## Publish"
            if [ -f data/results/LATEST.json ]; then
              python - <<'EOF'
          import json, pathlib
          p = json.loads(pathlib.Path("data/results/LATEST.json").read_text())
          m = json.loads((pathlib.Path("data/results") / p["path"] / "meta.json").read_text())
          keys = ["snapshot_id", "object_count", "conjunction_count", "scored_conjunctions", "model_version", "history_complete", "commit"]
          print("| | |\n|---|---|")
          for k in keys:
              print(f"| {k} | {m.get(k)} |")
          EOF
            else
              echo "No bundle was built."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
